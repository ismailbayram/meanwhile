[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meanwhile-cli"
version = "0.1.2"
description = "Play a quiz about your own repository while your coding agent works"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/ismailbayram/meanwhile"
Repository = "https://github.com/ismailbayram/meanwhile"

[project.scripts]
meanwhile = "meanwhile.cli:main"
# Named after the package, so `uvx meanwhile-cli` finds a command to run.
meanwhile-cli = "meanwhile.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/meanwhile"]
# Both non-Python files `meanwhile` reads at runtime. Named explicitly so
# neither can fall out of the wheel silently: the hook script would leave
# `meanwhile hooks install` copying nothing, and build_prompt.md would leave
# `meanwhile build-prompt` raising FileNotFoundError for anyone who installed
# from PyPI instead of a checkout.
artifacts = ["src/meanwhile/meanwhile-state.sh", "src/meanwhile/build_prompt.md"]

[tool.hatch.build.targets.sdist]
# An allowlist, not hatch's default of "everything git does not ignore": a
# release is public and permanent, and the working notes that sit beside the
# code (.superpowers/, docs/) are neither meant for it nor removable from it.
# The plugin files go in because the tests compare against them.
include = [
    "src",
    "tests",
    "hooks",
    "commands",
    "plugin.json",
    ".claude-plugin",
    ".agents",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
